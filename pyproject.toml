[project]
name = "data-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "python-dotenv",
]

[project.scripts]
data-manager = "data_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_manager"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
